services:
  redis:
    image: redis:alpine
    container_name: redis-prod
    restart: unless-stopped
    ports:
      - '6379:6379'

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-local
    restart: unless-stopped
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'
    volumes:
      - ./live-kit-config.yaml:/config/live-kit-config.yaml
    command: --config /config/live-kit-config.yaml

